name: CI/CD Unit Tests - Pipeline Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - CI/CD
  pull_request:
    branches:
      - main
      - develop
      - CI/CD

jobs:
  # ──────────────────────────────────────────
  # Test 1: Validate all workflow YAML files
  # ──────────────────────────────────────────
  test-workflow-syntax:
    name: "🧪 Test - Workflow YAML Syntax"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate all workflow YAML files
      run: |
        echo "🔍 Validating GitHub Actions workflow YAML syntax..."
        ERRORS=0

        pip install pyyaml --quiet

        for file in .github/workflows/*.yml; do
          echo "  📄 Checking: $file"
          if python3 -c "import yaml; yaml.safe_load(open('$file'))" 2>&1; then
            echo "    ✅ Valid YAML"
          else
            echo "    ❌ Invalid YAML!"
            ERRORS=$((ERRORS + 1))
          fi

          # Verify required keys exist
          if grep -q "^name:" "$file" && grep -q "^on:" "$file" && grep -q "^jobs:" "$file"; then
            echo "    ✅ Required workflow keys present (name, on, jobs)"
          else
            echo "    ❌ Missing required workflow keys!"
            ERRORS=$((ERRORS + 1))
          fi
        done

        if [ "$ERRORS" -gt 0 ]; then
          echo "❌ $ERRORS workflow file(s) have issues!"
          exit 1
        fi
        echo "✅ All workflow files are valid!"

  # ──────────────────────────────────────────
  # Test 2: Validate Dockerfile
  # ──────────────────────────────────────────
  test-dockerfile:
    name: "🧪 Test - Dockerfile Validation"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install hadolint
      run: |
        wget -qO hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
        chmod +x hadolint
        echo "✅ hadolint installed"

    - name: Lint Dockerfile
      run: |
        echo "🔍 Linting Dockerfile..."
        ./hadolint Dockerfile --no-fail || true
        echo "✅ Dockerfile lint complete"

    - name: Validate Dockerfile structure
      run: |
        echo "🔍 Validating Dockerfile structure..."
        ERRORS=0

        # Check multi-stage build exists
        STAGES=$(grep -c "^FROM" Dockerfile)
        echo "  📌 Build stages found: $STAGES"
        if [ "$STAGES" -lt 2 ]; then
          echo "  ⚠️  WARNING: No multi-stage build detected"
        else
          echo "  ✅ Multi-stage build confirmed"
        fi

        # Check non-root user exists
        if grep -q "USER" Dockerfile; then
          echo "  ✅ Non-root USER directive found"
        else
          echo "  ❌ No USER directive found - running as root!"
          ERRORS=$((ERRORS + 1))
        fi

        # Check EXPOSE directive
        if grep -q "^EXPOSE" Dockerfile; then
          EXPOSED=$(grep "^EXPOSE" Dockerfile | awk '{print $2}')
          echo "  ✅ EXPOSE port: $EXPOSED"
        else
          echo "  ⚠️  No EXPOSE directive found"
        fi

        # Check WORKDIR is set
        if grep -q "^WORKDIR" Dockerfile; then
          echo "  ✅ WORKDIR configured"
        else
          echo "  ❌ No WORKDIR set!"
          ERRORS=$((ERRORS + 1))
        fi

        # Check CMD or ENTRYPOINT exists
        if grep -qE "^(CMD|ENTRYPOINT)" Dockerfile; then
          echo "  ✅ CMD/ENTRYPOINT defined"
        else
          echo "  ❌ No CMD or ENTRYPOINT!"
          ERRORS=$((ERRORS + 1))
        fi

        if [ "$ERRORS" -gt 0 ]; then
          echo "❌ Dockerfile has $ERRORS structural issue(s)!"
          exit 1
        fi
        echo "✅ Dockerfile structure is valid!"

  # ──────────────────────────────────────────
  # Test 3: Docker build (without push)
  # ──────────────────────────────────────────
  test-docker-build:
    name: "🧪 Test - Docker Build"
    runs-on: ubuntu-latest
    needs: test-dockerfile
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image (no push)
      run: |
        echo "🔨 Building Docker image (test only, no push)..."
        docker build -t statuspage-test:${{ github.sha }} .
        echo "✅ Docker image built successfully!"

    - name: Verify image exists
      run: |
        echo "🔍 Verifying built image..."
        docker images statuspage-test:${{ github.sha }}
        IMAGE_SIZE=$(docker images statuspage-test:${{ github.sha }} --format "{{.Size}}")
        echo "  📌 Image size: $IMAGE_SIZE"
        echo "✅ Image verification passed!"

    - name: Test container starts
      run: |
        echo "🔍 Testing container startup..."
        # Start with minimal config (just to check gunicorn starts)
        docker run -d --name test-container \
          -e SECRET_KEY=test-secret-key-for-ci \
          -e DB_HOST=localhost \
          -e DB_PASS=testpass \
          -e ALLOWED_HOSTS='*' \
          statuspage-test:${{ github.sha }} \
          sh -c "sleep 5 && echo 'Container started'"

        # Give it a moment to start
        sleep 3

        # Check container is running (or at least started)
        STATUS=$(docker inspect -f '{{.State.Status}}' test-container 2>/dev/null || echo "not found")
        echo "  📌 Container status: $STATUS"

        # Cleanup
        docker stop test-container 2>/dev/null || true
        docker rm test-container 2>/dev/null || true
        echo "✅ Container startup test passed!"

    - name: Run Trivy scan (no push)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: statuspage-test:${{ github.sha }}
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

  # ──────────────────────────────────────────
  # Test 4: Python linting & dependency check
  # ──────────────────────────────────────────
  test-python-code:
    name: "🧪 Test - Python Code Quality"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint safety

    - name: Run flake8 (critical errors only)
      run: |
        echo "🔍 Running flake8..."
        flake8 statuspage/ --count --select=E9,F63,F7,F82 --show-source --statistics
        echo "✅ flake8 passed!"

    - name: Verify requirements.txt exists and is valid
      run: |
        echo "🔍 Checking requirements.txt..."
        if [ ! -f "requirements.txt" ]; then
          echo "❌ requirements.txt not found!"
          exit 1
        fi

        # Check for empty file
        if [ ! -s "requirements.txt" ]; then
          echo "❌ requirements.txt is empty!"
          exit 1
        fi

        PACKAGES=$(grep -v "^#" requirements.txt | grep -v "^$" | wc -l)
        echo "  📌 Packages defined: $PACKAGES"

        # Verify packages can be resolved
        pip install --dry-run -r requirements.txt 2>&1 | tail -5
        echo "✅ requirements.txt is valid!"

  # ──────────────────────────────────────────
  # Test 5: docker-compose validation
  # ──────────────────────────────────────────
  test-docker-compose:
    name: "🧪 Test - Docker Compose Validation"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate docker-compose syntax
      run: |
        echo "🔍 Validating docker-compose.yml..."
        docker compose config --quiet
        echo "✅ docker-compose.yml syntax is valid!"

    - name: Verify all services are defined
      run: |
        echo "🔍 Checking required services..."
        ERRORS=0

        for service in app db redis; do
          if docker compose config --services | grep -q "^${service}$"; then
            echo "  ✅ Service '$service' is defined"
          else
            echo "  ❌ Service '$service' is MISSING!"
            ERRORS=$((ERRORS + 1))
          fi
        done

        if [ "$ERRORS" -gt 0 ]; then
          echo "❌ $ERRORS required service(s) missing!"
          exit 1
        fi
        echo "✅ All required services are defined!"

    - name: Verify volumes are defined
      run: |
        echo "🔍 Checking volumes..."
        docker compose config --volumes
        echo "✅ Volumes configuration is valid!"

    - name: Verify network and port mappings
      run: |
        echo "🔍 Checking port mappings..."
        docker compose config | grep -A5 "ports:" || echo "No port mappings found"
        echo "✅ Network configuration checked!"

  # ──────────────────────────────────────────
  # Test 7: CI/CD pipeline integration test
  # ──────────────────────────────────────────
  test-pipeline-integration:
    name: "🧪 Test - Pipeline Integration"
    runs-on: ubuntu-latest
    needs:
      - test-workflow-syntax
      - test-dockerfile
      - test-docker-build
      - test-python-code
      - test-docker-compose
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate CI/CD environment variables
      run: |
        echo "🔍 Checking CI/CD configuration..."
        ERRORS=0

        # Verify workflow references correct ECR repository
        if grep -q "ECR_REPOSITORY" .github/workflows/app-build.yml; then
          echo "  ✅ ECR_REPOSITORY is configured"
        else
          echo "  ❌ ECR_REPOSITORY not found in workflow!"
          ERRORS=$((ERRORS + 1))
        fi

        # Verify AWS_REGION is set
        if grep -q "AWS_REGION" .github/workflows/app-build.yml; then
          echo "  ✅ AWS_REGION is configured"
        else
          echo "  ❌ AWS_REGION not found in workflow!"
          ERRORS=$((ERRORS + 1))
        fi

        # Verify infrastructure dispatch is configured
        if grep -q "repository-dispatch" .github/workflows/app-build.yml; then
          echo "  ✅ Infrastructure dispatch configured"
        else
          echo "  ⚠️  No infrastructure dispatch found"
        fi

        # Verify Trivy scanning is configured
        if grep -q "trivy-action" .github/workflows/app-build.yml; then
          echo "  ✅ Trivy security scanning configured"
        else
          echo "  ⚠️  No Trivy scanning configured"
        fi

        if [ "$ERRORS" -gt 0 ]; then
          echo "❌ Pipeline configuration has $ERRORS issue(s)!"
          exit 1
        fi
        echo "✅ Pipeline integration checks passed!"

    - name: Verify project file structure
      run: |
        echo "🔍 Checking required project files..."
        ERRORS=0

        REQUIRED_FILES=(
          "Dockerfile"
          "docker-compose.yml"
          "requirements.txt"
          ".github/workflows/app-build.yml"
          "statuspage/manage.py"
          "statuspage/statuspage/configuration.py"
          "statuspage/statuspage/settings.py"
        )

        for file in "${REQUIRED_FILES[@]}"; do
          if [ -f "$file" ]; then
            echo "  ✅ $file exists"
          else
            echo "  ❌ $file is MISSING!"
            ERRORS=$((ERRORS + 1))
          fi
        done

        if [ "$ERRORS" -gt 0 ]; then
          echo "❌ $ERRORS required file(s) missing!"
          exit 1
        fi
        echo "✅ All required project files are present!"

    - name: Final summary
      run: |
        echo "=============================================="
        echo "🎉 ALL CI/CD UNIT TESTS PASSED"
        echo "=============================================="
        echo ""
        echo "✅ Workflow YAML syntax     - Valid"
        echo "✅ Dockerfile               - Valid & builds"
        echo "✅ Docker image             - Builds successfully"
        echo "✅ Python code quality      - Passed"
        echo "✅ docker-compose.yml       - Valid"
        echo "✅ Pipeline integration     - Verified"
        echo ""
        echo "All processes are functional without code changes or image pushes."
