name: CI - Build, Scan & Push to ECR

on:
  push:
    branches:
      - main
      - develop
      - CI/CD
  pull_request:
    branches:
      - main
      - develop
      - CI/CD

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 992382545251.dkr.ecr.us-east-1.amazonaws.com/nadav-statuspage
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies for linting
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint
    
    - name: Run Linting (Python Code Quality)
      run: |
        echo "Running flake8..."
        flake8 statuspage/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        echo "✅ Linting complete"
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build Docker image
      run: |
        docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
                     -t ${{ env.ECR_REPOSITORY }}:latest .
        echo "✅ Docker image built successfully!"
    
    - name: Run Trivy security scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        format: 'table'
        exit-code: '0'  # Don't fail the build, just report
        severity: 'CRITICAL,HIGH'
    
    - name: Push to ECR (on main/develop only)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      run: |
        docker push ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        docker push ${{ env.ECR_REPOSITORY }}:latest
        echo "✅ Image pushed to ECR"
    
    - name: Trigger Infrastructure Update
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.PAT_TOKEN }}
        repository: ${{ github.repository_owner }}/status-page-infra
        event-type: update-image
        client-payload: '{"image_tag": "${{ github.sha }}", "repository": "${{ github.repository }}"}'