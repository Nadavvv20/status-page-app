services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: statuspage
      POSTGRES_USER: statuspage
      POSTGRES_PASSWORD: mysecurepassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  app:
    build: .
    container_name: statuspage_app
    command: >
      sh -c "python3 manage.py migrate &&
             python3 manage.py collectstatic --no-input &&
             gunicorn --bind 0.0.0.0:8000 statuspage.wsgi:application
             --workers 3 
             --worker-class gthread 
             --threads 2 
             --timeout 60" 
    environment:
      - DB_HOST=db
      - DB_NAME=statuspage
      - DB_USER=statuspage
      - DB_PASS=mysecurepassword
      - REDIS_HOST=redis
      - ALLOWED_HOSTS=*
    depends_on:
      - db
      - redis
    volumes:
      - static_content:/app/statuspage/static

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_content:/usr/share/nginx/html/static:ro
    depends_on:
      - app

volumes:
  postgres_data:
  static_content:
